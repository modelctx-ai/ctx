name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 要求 Node ^22.18 || ^24.11，22.x / 24.x 取的是最新补丁版本
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取 package.json 的 packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 格式（Oxfmt）、lint（Oxlint）和类型检查（tsgolint，TS 7）一次跑完
      - run: pnpm exec vp check --deny-warnings
      - run: pnpm test
      - run: pnpm build
      # 例子按使用方的方式（读 dist/）各跑一遍，模型是剧本的
      - run: pnpm examples

  pack:
    # 发布出去的包在使用方那边能不能用：干净目录里装上 `pnpm pack` 的产物，类型解析一遍，
    # 再换到各包 `engines.node` 写的最低版本上把每个入口 import 一遍（sqlite 要 22.13，别的 22.0）。
    name: Pack smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22.13.0', 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/pack-smoke.mjs --dir "$RUNNER_TEMP/pack-smoke"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: node scripts/pack-smoke.mjs --dir "$RUNNER_TEMP/pack-smoke" --run-only

  claude-code:
    # ctx-claude-code 的测试和 examples/claude-code.ts 对着真的 Claude Code 跑（模型是本机的假接口，不联网、不要密钥）。
    # 别的作业里没装 `claude`，这些用例跳过；这里装 README 写的那个版本，没装上就失败（`CTX_TEST_CLAUDE_CODE=required`）。
    # 升级 Claude Code 先改这里。
    name: Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code@2.1.326
      - run: claude --version
      - run: pnpm exec vp test packages/claude-code examples
        env:
          CTX_TEST_CLAUDE_CODE: required

  pydantic-ai:
    # python/pydantic-ai：Python 写的 pydantic-ai 适配器，不在 pnpm 的工作区里，依赖照 uv.lock。
    # 要 node 的用例（对照 TypeScript 的协议包、对着 ctx-remote 跑、ctx-conformance）读各包的 src/，不用构建，
    # 但要 `pnpm install`；`CTX_TEST_PYDANTIC_AI=required`：缺了 node、依赖或 uv 就失败，不跳过。
    # 3.11 是 `requires-python` 的下限。examples/pydantic-ai.ts 也在这里跑（别的作业里没有 uv，它跳过）。
    name: pydantic-ai (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - working-directory: python/pydantic-ai
        run: uv sync --locked
      - working-directory: python/pydantic-ai
        run: uv run --locked ruff check
      - working-directory: python/pydantic-ai
        run: uv run --locked ruff format --check
      - working-directory: python/pydantic-ai
        run: uv run --locked pytest
        env:
          CTX_TEST_PYDANTIC_AI: required
      - run: pnpm exec vp test examples
        env:
          CTX_TEST_PYDANTIC_AI: required

  downstream:
    # yoyo 经 `link:../ctx/packages/*` 读这里的 `dist/`，它的 CI 检出 ctx `main` 的最新提交：
    # 这里合进一个让它编不过的改动，它那边当场就红。所以在 PR 上先试一遍：用这次的构建产物跑 yoyo 的检查和测试。
    # 不拦合并（`continue-on-error`）：有意的不兼容改动会让它红，红了说明合并前要有对应的 yoyo PR 在等（AGENTS.md）。
    name: Downstream (yoyo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # 和本地一样两个仓库并排：yoyo 的 overrides 才找得到 ../ctx/packages/*
      - uses: actions/checkout@v4
        with:
          path: ctx

      - uses: actions/checkout@v4
        with:
          repository: modelctx-ai/yoyo
          path: yoyo

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ctx/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: |
            ctx/pnpm-lock.yaml
            yoyo/pnpm-lock.yaml

      - name: Build ctx
        working-directory: ctx
        run: pnpm install --frozen-lockfile && pnpm build

      - working-directory: yoyo
        run: pnpm install --frozen-lockfile
      - name: yoyo 的格式、lint 和类型检查
        working-directory: yoyo
        run: pnpm exec vp check --deny-warnings
      - name: yoyo 的测试
        working-directory: yoyo
        run: pnpm test

      - name: 红了怎么办
        if: failure()
        run: |
          {
            echo '### yoyo 用这次的 ctx 过不了'
            echo
            echo '这个作业不拦合并。如果是有意的不兼容改动：合并前要有对应的 yoyo PR 在等，并在这个 PR 的正文里链接它。'
            echo '如果不是有意的：看上面哪一步失败，先在本地的 `../yoyo` 里复现（ctx 里 `pnpm build`，yoyo 里 `pnpm exec vp check --deny-warnings && pnpm test`）。'
          } >>"$GITHUB_STEP_SUMMARY"
          echo '::warning title=Downstream (yoyo)::yoyo 用这次的 ctx 过不了：合并前要有对应的 yoyo PR，或者这是一个没想到的不兼容改动。'
