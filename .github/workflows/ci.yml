name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 要求 Node ^22.18 || ^24.11，22.x / 24.x 取的是最新补丁版本
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取 package.json 的 packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 格式（Oxfmt）、lint（Oxlint）和类型检查（tsgolint，TS 7）一次跑完
      - run: pnpm exec vp check --deny-warnings
      - run: pnpm test
      - run: pnpm build
